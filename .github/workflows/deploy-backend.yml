name: Deploy backend to AWS

on:
  push:
    branches: [main]
    paths:
      - "solarcms-backend/**"
      - "deploy/aws/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Release an image built earlier (a commit SHA). Leave empty to build this commit."
        required: false
      build_only:
        description: "Build and store the image, but do not release it"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: solarcms-backend

jobs:
  test:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solarcms-backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      MQTT_HOST: localhost
      JWT_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,reports,aws]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy src/solarcms
      - name: Unit tests
        run: pytest tests/unit -q

  deploy:
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS (no stored password)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/solarcms-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to the image store
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up ARM emulation
        if: ${{ !inputs.image_tag }}
        uses: docker/setup-qemu-action@v3

      - name: Set up the image builder
        if: ${{ !inputs.image_tag }}
        uses: docker/setup-buildx-action@v3

      - name: Build and store the ARM image
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: solarcms-backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release (migrations, then the five processes)
        if: ${{ !inputs.build_only && vars.DEPLOY_ENABLED == 'true' }}
        run: bash deploy/aws/release.sh "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag || github.sha }}"
