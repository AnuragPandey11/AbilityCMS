name: Checks

# Every pull request into main: the backend, the website and the Terraform files
# are checked before anything can be merged (and so before anything is released).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solarcms-backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      MQTT_HOST: localhost
      JWT_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solarcms-backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,reports,aws]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy src/solarcms
      - name: Unit tests
        run: pytest tests/unit -q

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solarcms-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solarcms-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://api.example.com
          VITE_WS_BASE: wss://api.example.com

  terraform:
    name: Terraform files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate
