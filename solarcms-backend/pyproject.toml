# Versions pinned exactly, per BACKEND_SPEC §2.
[project]
name = "solarcms"
version = "0.1.0"
description = "SolarCMS backend — MQTT ingestion, TimescaleDB history, REST/WebSocket API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # [asyncio] pulls greenlet, which SQLAlchemy's async engine requires.
    "sqlalchemy[asyncio]==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "aiomqtt==2.3.0",
    "redis==5.0.8",
    "pyjwt==2.9.0",
    "argon2-cffi==23.1.0",
    "openpyxl==3.1.5",
    "httpx==0.27.2",
    "structlog==24.4.0",
]

[project.optional-dependencies]
# weasyprint needs system pango/cairo; it is only required at Phase 9 (Reports),
# so it is an extra rather than a hard dependency that blocks Phase 0 setup.
reports = ["weasyprint==62.3"]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "testcontainers==4.8.1",
    "ruff==0.6.8",
    "mypy==1.11.2",
    "paho-mqtt==2.1.0",   # tools/probe_broker.py only; aiomqtt covers the worker
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarcms"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids function calls in argument defaults, which is precisely how
# FastAPI declares dependencies. These calls are evaluated once at import and are
# the framework's intended idiom, so they are exempted rather than suppressed
# line by line. `require_permission` and `require_dashboard` are our own guard
# factories used the same way.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path",
    "fastapi.Body", "fastapi.Form", "fastapi.File",
    "solarcms.api.deps.require_permission", "solarcms.api.deps.require_dashboard",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/solarcms"]

[[tool.mypy.overrides]]
# openpyxl ships no stubs; weasyprint is an optional extra and is absent
# from the default environment by design (it needs system pango/cairo).
module = ["aiomqtt.*", "testcontainers.*", "asyncpg.*", "openpyxl.*",
          "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Each test gets its own loop, which is what the conftest engine-disposal fixture
# assumes: an asyncpg pool is bound to the loop that created it.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
